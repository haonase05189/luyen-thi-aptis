
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nền Tảng English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=Noto+Sans:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sticky top bar with skill tabs; one centered column (max 980px); each skill page = part chips + one task card; admin = list + editor */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#16233F; --muted:#5B6782; --line:#DCE2EC;
  --accent:#0B7A7C; --accent-ink:#FFFFFF; --accent-soft:#DDF1F0; --mark:#FFE07A;
  --good:#1E7F48; --good-soft:#E1F4E8; --bad:#B93A33; --bad-soft:#FBE6E4; --warn:#9A6400; --warn-soft:#FFF1D6;
  --font:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ipa:'Noto Sans', 'Segoe UI', 'Lucida Sans Unicode', sans-serif;
  --mono:ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1626; --surface:#172136; --ink:#E7ECF5; --muted:#9AA6BF; --line:#2A3651;
  --accent:#3CC2C0; --accent-ink:#06201F; --accent-soft:#123A3C; --mark:rgba(255,208,80,.38);
  --good:#5BD08B; --good-soft:#14352A; --bad:#F07B72; --bad-soft:#3D1B1B; --warn:#F2B755; --warn-soft:#3A2C12; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#172136; --ink:#E7ECF5; --muted:#9AA6BF; --line:#2A3651;
  --accent:#3CC2C0; --accent-ink:#06201F; --accent-soft:#123A3C; --mark:rgba(255,208,80,.38);
  --good:#5BD08B; --good-soft:#14352A; --bad:#F07B72; --bad-soft:#3D1B1B; --warn:#F2B755; --warn-soft:#3A2C12; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.ipa{font-family:var(--ipa);color:var(--muted)}
.mark{background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 2px}
.vh{position:absolute;left:-9999px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px 16px;padding-block:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:14px}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:8px 11px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab:hover{background:var(--bg);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.tab.admin{color:var(--accent)}

main{padding-block:28px 64px;display:grid;gap:24px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);margin:6px 0 0;max-width:64ch}
.h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em}
.h2{font-size:20px;font-weight:700}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.note b{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;display:grid;gap:12px;justify-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .n span{font-size:.5em;color:var(--muted)}
.stat .l{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.scroll{overflow-x:auto}
table.fmt{width:100%;border-collapse:collapse;font-size:15px;min-width:620px}
.fmt th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.fmt td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.fmt tr:last-child td{border-bottom:0}
.fmt .sk{font-weight:700}
.fmt .tm{font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;min-width:80px}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
ul.tips{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}

.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:18px;min-width:0}
.instr{margin:4px 0 0;color:var(--muted)}
.passage{background:var(--bg);border-radius:12px;padding:16px 18px;display:grid;gap:12px;font-size:15.5px}
.passage p{margin:0}
.who{font-weight:700}
.items{display:grid;gap:14px}
.item{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0;padding-bottom:0}
.q{font-weight:600;display:flex;gap:10px;align-items:baseline;min-width:0}
.q > span:last-child{min-width:0;overflow-wrap:anywhere}
.num{flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:22px}
.opts{display:flex;gap:8px;flex-wrap:wrap;padding-left:32px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;font-weight:500;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);opacity:1}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);opacity:1}
.opt:disabled{cursor:default}
.selrow{padding-left:32px}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
select.right{border-color:var(--good);background:var(--good-soft)}
select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding-left:32px;font-size:14px;color:var(--muted)}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}
.para{font-size:15px;font-weight:400;line-height:1.65}
ol.order{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ol.order li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
ol.order li span.t{flex:1;min-width:0}
ol.order li.fixed{background:var(--accent-soft);border-color:transparent;font-weight:500}
ol.order li.right{border-color:var(--good);background:var(--good-soft)}
ol.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.arrows{display:flex;gap:4px;flex:none}
.arrows button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px}
.taskfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.score{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
details .body{margin-top:10px;display:grid;gap:8px;font-size:15px}
details .body p{margin:0}

.play{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-self:start}
.play svg{width:16px;height:16px}
.item .play{margin-left:32px}

.wq{display:grid;gap:8px}
.wq .prompt{background:var(--bg);border-radius:10px;padding:10px 14px}
.wq .prompt .from{font-size:13px;color:var(--muted)}
textarea,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.55}
textarea.long{min-height:240px}
textarea.code{font-family:var(--mono);font-size:14px;min-height:300px;white-space:pre;overflow-x:auto}
.wc{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.wc.ok{color:var(--good)} .wc.low{color:var(--warn)} .wc.high{color:var(--bad)}
.timer{display:grid;gap:8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px}
.timer .lab{font-size:14px;opacity:.8}
.timer .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.timer .qnow{font-weight:600}
.timer .track{background:rgba(127,127,127,.35)}
.timer .track i{background:var(--mark)}
.pic{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:var(--bg)}
.pic svg{flex:none;width:28px;height:28px;color:var(--muted)}
.qlist{margin:0;padding-left:22px;display:grid;gap:4px}
.phr{display:flex;flex-wrap:wrap;gap:6px}
.phr span{background:var(--accent-soft);border-radius:6px;padding:2px 8px;font-size:14px}

.deckbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.chk{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:15px}
.cardzone{display:grid;justify-items:center;gap:16px}
.card{width:min(520px,100%);min-height:250px;border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:28px;display:grid;place-items:center;text-align:center;box-shadow:0 10px 30px -18px rgba(10,20,40,.35);cursor:pointer}
.card .big{font-size:clamp(30px,7vw,42px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.card .vi{font-size:26px;font-weight:700}
.card .hint{color:var(--muted);font-size:13px;margin-top:10px}
.counter{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.say{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:40px;display:inline-grid;place-items:center}
.say svg{width:18px;height:18px}
.btn.no{border-color:var(--bad);color:var(--bad)}
.btn.yes{border-color:var(--good);color:var(--good)}

/* admin */
.alist{list-style:none;margin:10px 0 12px;padding:0;display:grid}
.alist li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.alist .info{flex:1;min-width:180px}
.alist .info .k{font-size:13px;color:var(--muted)}
.alist .info .t{font-weight:600}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field > label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.help{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:8px}
.help pre{margin:0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
.errs{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px}
.errs ul{margin:4px 0 0;padding-left:20px}
.okmsg{background:var(--good-soft);color:var(--good);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.pv{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;font-size:15px}
.pv ol{margin:0;padding-left:22px;display:grid;gap:8px}
.pv .ok{color:var(--good);font-weight:600}
.pv .dim{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:20;box-shadow:0 8px 24px -10px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

/* study time */
.dim{color:var(--muted);font-size:14px}
.tnow{display:flex;align-items:baseline;gap:8px;margin:12px 0 8px}
.tnow .big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tstats div{display:grid;gap:2px}.tstats b{font-size:16px;font-variant-numeric:tabular-nums}.tstats span{font-size:12px;color:var(--muted)}
.tchart{position:relative;height:150px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;margin-top:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.tcol{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.tcol i{display:block;width:70%;max-width:34px;min-height:2px;background:var(--accent);border-radius:6px 6px 2px 2px;opacity:.75}
.tcol.today i{opacity:1}
.tcol .tv{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:3px}
.tcol .tl{position:absolute;bottom:-20px;font-size:12px;color:var(--muted)}
.tcol.today .tl{color:var(--ink);font-weight:600}
.tgoal{position:absolute;left:0;right:0;border-top:1px dashed var(--warn);pointer-events:none}
.tgoal span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--warn)}
.tskills{display:grid;gap:8px}
.tsk{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;font-size:14px}
.tsk .tm2{text-align:right;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:13px;padding-block:0 32px}
@media (max-width:760px){
  .grid2,.fgrid{grid-template-columns:1fr}
  .stats{gap:8px}.stat{padding:12px}.stat .n{font-size:24px}.stat .l{font-size:12px}
  .task{padding:16px}
  .opts,.selrow,.fb{padding-left:0}.item .play{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="brand"><b>EN</b>Nền Tảng English <small>· Luyện thi Aptis</small></div>
    <nav class="tabs" aria-label="Kỹ năng">
      <button class="tab" data-go="tong-quan">Tổng quan</button>
      <button class="tab" data-go="core">Core</button>
      <button class="tab" data-go="reading">Reading</button>
      <button class="tab" data-go="listening">Listening</button>
      <button class="tab" data-go="writing">Writing</button>
      <button class="tab" data-go="speaking">Speaking</button>
      <button class="tab" data-go="flashcard">Từ vựng</button>
      <button class="tab admin" data-go="quan-ly" id="adminTab" hidden>Quản lý</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap">Bài luyện theo cấu trúc Aptis General do British Council công bố; không phải đề thi thật. Tiến độ và bài viết của bạn lưu trên trình duyệt này. Bài nghe phát file mp3 trong thư mục audio; thiếu file thì dùng giọng đọc của thiết bị. <button class="btn small" data-go="quan-ly" style="margin-left:6px">Quản lý tài liệu</button></footer>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== PARSER START ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function paras(s){if(!s||!String(s).trim())return '';
  return String(s).replace(/\r/g,'').trim().split(/\n\s*\n/).map(p=>{p=p.trim();const m=p.match(/^([^:\n]{1,24}):\s/);
    return '<p>'+(m?'<span class="who">'+esc(m[1])+':</span> '+rich(p.slice(m[0].length)):rich(p))+'</p>'}).join('')}
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toUpperCase().replace(/\s+/g,' ').trim()}
const KEYS={'NGUOI HOI':'from','CAU HOI':'q','SO TU':'r','BAI MAU':'s','LUA CHON':'options','ANH':'pic','CUM TU':'phrases','CHUAN BI':'prep','NOI':'talk','AUDIO':'file','FILE':'file'};
function keyLine(l){const m=l.match(/^([^:]{2,20}):\s*(.*)$/);if(!m)return null;const k=KEYS[norm(m[1])];return k?[k,m[2].trim()]:null}
function audioLine(l){const m=l.match(/^(M|W|F|Nam|Nữ|Nu)\s*:\s*(.+)$/i);if(!m)return null;return [/^(m|nam)$/i.test(m[1])?'M':'F',m[2].trim()]}
function lines(s){return String(s||'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean)}
function blocks(s){return String(s||'').replace(/\r/g,'').split(/\n\s*\n/).map(lines).filter(b=>b.length)}
function parseAudio(s){const out=[];lines(s).forEach(l=>{const a=audioLine(l);if(a)out.push(a);else if(out.length)out[out.length-1][1]+=' '+l;else out.push(['F',l]);});return out}
const KINDS_FOR={core:['mcq','select','order'],reading:['mcq','select','order'],listening:['mcq','select','order'],writing:['writing'],speaking:['speaking'],vocab:['vocab']};

function parseDoc(id,d){
  const errs=[];d=d||{};
  const t={id,skill:d.skill,kind:d.kind,part:String(d.part||'').trim()||'Bài luyện',title:String(d.title||'').trim()||'(Chưa đặt tiêu đề)',
    instr:rich(String(d.instr||'').trim()),order:+d.order||0,v:d.updatedAt||0,group:String(d.group||'').trim()};
  if(!KINDS_FOR[d.skill])errs.push('Chưa chọn kỹ năng.');
  else if(!KINDS_FOR[d.skill].includes(d.kind))errs.push('Dạng bài không hợp với kỹ năng đã chọn.');
  if(!String(d.title||'').trim())errs.push('Thiếu tiêu đề.');
  const k=d.kind;
  if(k==='mcq'||k==='select'){t.intro=paras(d.intro);const al=String(d.audio||'').split('\n');const fk=al.map(l=>keyLine(l.trim())).find(x=>x&&x[0]==='file');t.file=fk?fk[1]:'';const au=parseAudio(al.filter(l=>{const x=keyLine(l.trim());return !(x&&x[0]==='file');}).join('\n'));t.audio=au.length?au:null;}
  if(k==='mcq'){
    t.items=blocks(d.body).map((b,bi)=>{const it={q:b[0],opts:[],a:-1,why:''};const au=[];

function playMedia(src,ls){stopMedia();if(!src){speakLines(ls);return;}let fell=false;const fb=()=>{if(fell)return;fell=true;if(ls&&ls.length)speakLines(ls);else toast('Không phát được file âm thanh.');};try{const a=new Audio(src);curAudio=a;a.onerror=fb;const p=a.play();if(p&&p.catch)p.catch(fb);}catch(e){fb();}}
function fileFor(t,key){if(key==='all')return t.file||'';const it=t.items[+key];return it&&it.file||''}
function playBtn(t,s,key){const n=s.plays[key]||0;
  if(!canSpeak&&!fileFor(t,key))return `<div class="note"><b>Thiết bị không hỗ trợ đọc âm thanh.</b> Bạn có thể đọc lời thoại sau khi chấm điểm.</div>`;
  return `<button class="play" data-play="${esc(t.id)}|${esc(key)}" ${n>=2?'disabled':''}>${ICON_SAY}${n>=2?'Đã nghe 2 lần':n===1?'Nghe lần 2':'Nghe'}</button>`;}
function audioFor(t,key){if(key==='all')return t.audio;const i=+key;return t.items[i]&&t.items[i].audio}
function transcript(ls){return ls.map(([g,x])=>`<p>${ls.length>1?`<b>${g==='F'?'Woman':'Man'}:</b> `:''}${esc(x)}</p>`).join('')}

/* ================= TIMER ================= */
let tm=null;
function stopTimer(){if(tm){clearInterval(tm.iv);tm=null;}stopMedia();}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function runSteps(steps,mountId,onDone){stopTimer();let i=0,left=0,dur=1;
  const el=()=>document.getElementById(mountId);
  function start(){const st=steps[i];left=dur=st.secs||1;if(st.say)speak(st.say);draw();}
  function draw(){const e=el();if(!e){stopTimer();return;}const st=steps[i];
    e.innerHTML=`<div class="timer" role="timer"><div class="lab">${esc(st.label)}${steps.length>1?` · bước ${i+1}/${steps.length}`:''}</div>${st.q?`<div class="qnow">${esc(st.q)}</div>`:''}<div class="big">${fmt(left)}</div><div class="track"><i style="width:${(1-left/dur)*100}%"></i></div><div class="row">${i<steps.length-1?'<button class="btn small" data-skip>Sang bước tiếp</button>':''}<button class="btn small" data-stop>Dừng</button></div></div>`;}
  tm={iv:setInterval(()=>{left--;if(left<0){i++;if(i>=steps.length){stopTimer();const e=el();if(e)e.innerHTML=`<div class="note"><b>Hết giờ.</b> Bạn đã hoàn thành phần này.</div>`;onDone&&onDone();return;}start();}else draw();},1000),skip(){left=0;}};
  start();}

function renderTaskPage(sk){
  if(!CONTENT[sk].length){app.innerHTML=emptySkill(sk);return;}
  const list=groupList(sk);if(cur[sk]>=list.length)cur[sk]=0;
  const t=list[cur[sk]];const s=rt(t);const done=s.checked;const A=s.ans;
  let body='';
  if(t.audio||t.file)body+=`<div class="row">${playBtn(t,s,'all')}</div>`;
  if(t.intro)body+=`<div class="passage">${t.intro}</div>`;
  const longText=t.kind==='select'&&t.items.some(it=>it.q.length>140);
  if(t.kind==='mcq'||t.kind==='select'){
    body+=`<div class="items">${t.items.map((it,i)=>{
      const q=`<div class="q"><span class="num">${longText?'Đoạn '+(i+1):i+1}</span><span class="${longText?'para':''}">${esc(it.q)}</span></div>`;
      const au=(it.audio||it.file)?playBtn(t,s,String(i)):'';
      let ctl='',fb='';
      if(t.kind==='mcq'){ctl=`<div class="opts">${s.perm[i].map(k=>{let c='';if(done){if(k===it.a)c='right';else if(A[i]===k)c='wrong';}
          return `<button class="opt ${c}" data-ans="${esc(t.id)}|${i}|${k}" aria-pressed="${A[i]===k}" ${done?'disabled':''}>${esc(it.opts[k])}</button>`}).join('')}</div>`;
        if(done)fb=`<div class="fb">${A[i]===it.a?'<b class="ok">Đúng.</b>':'<b class="no">Sai.</b> Đáp án: '+esc(it.opts[it.a])+'.'} ${esc(it.why)}</div>`;}
      else{const v=A[i]||'';const c=done?(v===it.a?'right':'wrong'):'';
        ctl=`<div class="selrow"><label class="vh" for="sel-${esc(t.id)}-${i}">Đáp án câu ${i+1}</label><select id="sel-${esc(t.id)}-${i}" class="${c}" data-sel="${esc(t.id)}|${i}" ${done?'disabled':''}><option value="">— Chọn —</option>${t.options.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
        if(done&&v!==it.a)fb=`<div class="fb"><b class="no">Đáp án:</b> ${esc(it.a)}</div>`;}
      return `<div class="item">${q}${au}${ctl}${fb}</div>`}).join('')}</div>`;
  }else if(t.kind==='order'){
    const o=s.order;
    body+=`<ol class="order"><li class="fixed"><span class="t">${esc(t.first)}</span></li>${o.map((si,pos)=>`<li class="${done?(si===pos?'right':'wrong'):''}"><span class="t">${esc(t.sentences[si])}</span>${done?'':`<span class="arrows"><button data-mv="${esc(t.id)}|${pos}|-1" aria-label="Lên" ${pos===0?'disabled':''}>↑</button><button data-mv="${esc(t.id)}|${pos}|1" aria-label="Xuống" ${pos===o.length-1?'disabled':''}>↓</button></span>`}</li>`).join('')}</ol>`;
    if(done&&!o.every((v,i)=>v===i))body+=`<details><summary>Xem thứ tự đúng</summary><div class="body"><p>${esc(t.first)}</p>${t.sentences.map(x=>`<p>${esc(x)}</p>`).join('')}</div></details>`;
  }
  const scripts=[];if(t.audio)scripts.push(['',t.audio]);(t.items||[]).forEach((it,i)=>{if(it.audio)scripts.push([it.q,it.audio]);});
  if(done&&scripts.length)body+=`<details><summary>Xem lời thoại (transcript)</summary><div class="body">${scripts.map(([lab,ls])=>(lab&&scripts.length>1?`<p><b>${esc(lab)}</b></p>`:'')+transcript(ls)).join('')}</div></details>`;
  const answered=t.kind==='order'?true:t.items.every((_,i)=>A[i]!==undefined&&A[i]!=='');
  body+=`<div class="taskfoot">${done?`<span class="score">${score(t,s)}/${total(t)}</span><span style="color:var(--muted)">câu đúng${S.best[t.id]!==undefined?' · tốt nhất '+Math.min(S.best[t.id],total(t))+'/'+total(t):''}</span><button class="btn" data-retry="${esc(t.id)}">Làm lại</button>${cur[sk]<list.length-1?`<button class="btn primary" data-part="${cur[sk]+1}">Phần tiếp →</button>`:''}`
    :`<button class="btn primary" data-check="${esc(t.id)}" ${answered?'':'disabled'}>Chấm điểm</button><span style="color:var(--muted);font-size:14px">${answered?'':'Trả lời tất cả câu để chấm điểm'}</span>`}</div>`;
  app.innerHTML=head(sk)+groupBar(sk,list)+chips(list,cur[sk],x=>S.best[x.id]!==undefined)+`<section class="task">${taskHead(t)}${body}</section>`;
}

  p.qs.forEach((q,i)=>{const k=p.id+'-'+i;const el=document.getElementById('w-'+k);if(el)el.value=S.drafts[k]||'';updWC(k);});

function updatePreview(){

function previewHtml(t){

  if(k==='select')return `<div class="dim">Lựa chọn: ${esc((t.options||[]).join(' · '))}</div><ol>${(t.items||[]).map(it=>`<li>${esc(it.q.length>120?it.q.slice(0,120)+'…':it.q)} → <span class="ok">${esc(it.a)}</span>${it.audio?`<div class="dim">Nghe: ${esc(it.audio.map(a=>a[1]).join(' '))}</div>`:''}</li>`).join('')}</ol>`;
  if(k==='order')return `<div><b>Câu cho sẵn:</b> ${esc(t.first)}</div><ol>${(t.sentences||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
  if(k==='writing')return `<ol>${(t.qs||[]).map(q=>`<li>${q.from?`<b>${esc(q.from)}:</b> `:''}${rich(q.q)} <span class="dim">(${q.r[0]}–${q.r[1]} từ${q.input?', ô ngắn':''})</span>${q.s?`<div class="dim">Mẫu (${wc(q.s)} từ): ${rich(q.s)}</div>`:''}</li>`).join('')}</ol>`;
  if(k==='speaking')return `${(t.pics||[]).map(p=>`<div class="dim">Ảnh: ${esc(p)}</div>`).join('')}<ol>${(t.qs||[]).map(q=>`<li>${esc(q.q)}${q.t?` <span class="dim">(${q.t} giây)</span>`:''}</li>`).join('')}</ol>${t.prep?`<div class="dim">Chuẩn bị ${t.prep} giây · Nói ${t.talk} giây</div>`:''}${t.sample?`<div class="dim">Mẫu: ${rich(t.sample)}</div>`:''}`;
  if(k==='vocab')return `<ol>${(t.words||[]).map(w=>`<li><b>${esc(w[0])}</b> <span class="ipa">${esc(w[1])}</span> · ${esc(w[2])}${w[3]?` <span class="dim">— ${esc(w[3])}</span>`:''}</li>`).join('')}</ol>`;
  return '';
}
async function saveEd(){

  const doc={skill:ed.skill,kind:ed.kind,group:String(ed.group||'').trim(),part:String(ed.part||'').trim(),title:String(ed.title||'').trim(),instr:ed.instr||'',mins:+ed.mins||0,intro:ed.intro||'',audio:ed.audio||'',body:ed.body||'',order,updatedAt:Date.now()};
  try{await DB.set(id,doc);ed=null;toast('Đã lưu bài');render();window.scrollTo(0,0);}

}

  if(busy||!DB)return;const l=CONTENT[sk].slice();const j=i+dir;if(j<0||j>=l.length)return;
  [l[i],l[j]]=[l[j],l[i]];busy=true;
  try{for(let n=0;n<l.length;n++){if(l[n].order!==n+1)await DB.update(l[n].id,{order:n+1});}}
  catch(e){toast('Chưa đổi được thứ tự. Thử lại sau.');}
  busy=false;render();
}
async function delTask(id){if(!DB)return;try{await DB.del(id);toast('Đã xóa bài');}catch(e){toast('Chưa xóa được. Thử lại sau.');}confirmDel=null;render();}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,#card');if(!t||t.disabled)return;const d=t.dataset;
  if(d.go)return go(d.go);
  if(d.part!==undefined){stopTimer();cur[view]=+d.part;render();return window.scrollTo(0,0);}
  if(d.rand){const sk=d.rand;stopTimer();let list=CONTENT[sk].filter(t=>t.group===curGroup[sk]);if(list.length<2)list=CONTENT[sk];
    const curT=CONTENT[sk].filter(t=>t.group===curGroup[sk])[cur[sk]];let pick;let g=0;do{pick=list[Math.floor(Math.random()*list.length)];}while(list.length>1&&pick===curT&&g++<20);
    curGroup[sk]=pick.group;cur[sk]=CONTENT[sk].filter(t=>t.group===pick.group).indexOf(pick);render();return window.scrollTo(0,0);}
  if(d.say!==undefined)return speak(d.say);
  if(d.play){const [id,key]=d.play.split('|');const tk=BYID[id];if(!tk)return;const s=rt(tk);markDay();s.plays[key]=(s.plays[key]||0)+1;playMedia(fileFor(tk,key),audioFor(tk,key));return render();}
  if(d.ans){const [id,i,k]=d.ans.split('|');const tk=BYID[id];if(!tk)return;rt(tk).ans[+i]=+k;return render();}
  if(d.mv){const [id,pos,dir]=d.mv.split('|');const tk=BYID[id];if(!tk)return;const o=rt(tk).order;const a=+pos,b=a+ +dir;[o[a],o[b]]=[o[b],o[a]];return render();}
  if(d.check){const tk=BYID[d.check];if(!tk)return;const s=rt(tk);s.checked=true;markDay();S.best[tk.id]=Math.max(S.best[tk.id]||0,score(tk,s));save();stopMedia();return render();}
  if(d.retry){const tk=BYID[d.retry];if(!tk)return;resetRt(tk,rt(tk));return render();}
  if(d.frame){const [k,ty]=d.frame.split('|');const f=FRAMES[ty];if(!f||!f.frame)return;const cur0=S.drafts[k]||'';
    S.drafts[k]=cur0.trim()?cur0.replace(/\s+$/,'')+'\n\n'+f.frame:f.frame;save();const el=document.getElementById('w-'+k);if(el){el.value=S.drafts[k];el.focus();}updWC(k);return toast('Đã chèn khung. Thay dấu … bằng ý của bạn.');}
  if(d.wtimer){markDay();return runSteps([{label:'Thời gian viết',secs:+d.wtimer*60}],'wt');}
  if(d.speak){markDay();const p=BYID[d.speak];if(!p)return;return runSteps(speakSteps(p),'st',()=>{S.spoken[p.id]=true;save();});}
  if(d.skip!==undefined){if(tm)tm.skip();return;}
  if(d.stop!==undefined){stopTimer();return render();}
  if(t.id==='card'){fc.flip=!fc.flip;return renderFlash();}
  if(d.fc){const w=fc.list[fc.i];if(!w)return;markDay();if(d.fc==='yes')S.known[w.en]=true;else delete S.known[w.en];save();
    fc.flip=false;if(!(fc.onlyNew&&d.fc==='yes'))fc.i=(fc.i+1)%fc.list.length;return renderFlash();}
  // admin
  if(d.new!==undefined){stopTimer();view='quan-ly';ed=newEd(d.new||'core');try{history.replaceState(null,'','#quan-ly');}catch(_){}render();return window.scrollTo(0,0);}
  if(d.edit){const r=RAW[d.edit];if(!r)return;ed=Object.assign(newEd(r.skill||'core'),r,{id:d.edit,_saving:false});render();return window.scrollTo(0,0);}
  if(d.cancel!==undefined){ed=null;render();return window.scrollTo(0,0);}
  if(d.tpl!==undefined){const ta=document.getElementById('f-body');ed.body=(ed.body&&ed.body.trim()?ed.body.replace(/\s+$/,'')+'\n\n':'')+HELP[ed.kind].ex;if(ta)ta.value=ed.body;return updatePreview();}
  if(d.save!==undefined)return saveEd();
  if(d.export!==undefined){const data=JSON.stringify({format:'nentang-content-v1',items:DRAFT||PUBLISHED},null,1);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='content.json';document.body.appendChild(a);a.click();a.remove();return toast('Đã tải content.json. Giờ tải file này lên GitHub.');}
  if(d.dropdraft!==undefined){DRAFT=null;persistDraft();confirmDel=null;applyRaw();return render();}
  if(d.ord){const [sk,i,dir]=d.ord.split('|');return moveOrder(sk,+i,+dir);}
  if(d.askdel){confirmDel=d.askdel;return render();}
  if(d.nodel!==undefined){confirmDel=null;return render();}
  if(d.del){return delTask(d.del);}
});
document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(e.target.id==='goalSel'){S.goal=+e.target.value||30;save();return render();}
  if(d.grp){stopTimer();curGroup[d.grp]=e.target.value;cur[d.grp]=0;return render();}
  if(d.sel){const [id,i]=d.sel.split('|');const tk=BYID[id];if(!tk)return;rt(tk).ans[+i]=e.target.value;return render();}
  if(d.edsel&&ed){ed[d.edsel]=e.target.value;if(d.edsel==='skill'&&!KINDS_FOR[ed.skill].includes(ed.kind))ed.kind=KINDS_FOR[ed.skill][0];return renderEditor();}
  if(e.target.id==='importFile'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);const it=j.items||j;if(typeof it!=='object'||Array.isArray(it))throw 0;DRAFT=it;persistDraft();applyRaw();render();toast('Đã nhập '+Object.keys(it).length+' bài vào bản nháp.');}catch(_){toast('File không đúng định dạng content.json.');}};fr.readAsText(e.target.files[0]);return;}
  if(e.target.id==='deck'){fc.deck=e.target.value;fc.i=0;fc.flip=false;renderFlash();}
  if(e.target.id==='onlynew'){fc.onlyNew=e.target.checked;fc.i=0;fc.flip=false;renderFlash();}
});
let saveT=null;
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.ed&&ed){ed[d.ed]=e.target.value;clearTimeout(updatePreview.h);updatePreview.h=setTimeout(updatePreview,250);return;}
  const k=d.draft;if(!k)return;S.drafts[k]=e.target.value;updWC(k);clearTimeout(saveT);saveT=setTimeout(()=>{markDay();save();},400);});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!ed){const a=document.activeElement;if(!(a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))render();}},0);});
document.addEventListener('keydown',e=>{if(e.target.id==='card'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();fc.flip=!fc.flip;renderFlash();document.getElementById('card')?.focus();}});

const h0=(location.hash||'').slice(1);if(VIEWS.includes(h0))view=h0;
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(VIEWS.includes(h)&&h!==view)go(h);});
render();
initData();
</script>
